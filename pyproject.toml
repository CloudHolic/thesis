[project]
name = "thesis"
version = "0.1.0"
description = "VSRG difficulty measurement from play response data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "connectorx>=0.4.5",
    "polars>=1.44.1",
    "psycopg[binary]>=3.3.5",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thesis"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: requires a live PostgreSQL connection"]